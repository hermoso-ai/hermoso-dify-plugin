identity:
  author: hermoso-ai
  name: hermoso
  label:
    en_US: Hermoso
    zh_Hans: Hermoso
  description:
    en_US: AI marketing agent and AI ad generator. Research the ads winning in your market, generate on-brand image and video ads, and schedule posts to your social channels. No markup on models.
    zh_Hans: AI 营销智能体和 AI 广告生成器。调研市场上表现出色的广告，生成符合品牌风格的图片和视频广告，并将帖子定时发布到你的社交渠道。模型不加价。
  icon: icon.svg
  tags:
    - business
    - social
    - image
    - videos
    - search
credentials_for_provider:
  hermoso_api_key:
    type: secret-input
    required: true
    label:
      en_US: Hermoso API key
      zh_Hans: Hermoso API 密钥
    placeholder:
      en_US: hmk_...
      zh_Hans: hmk_...
    help:
      en_US: Create a key in the Hermoso app under MCP & CLI.
      zh_Hans: 在 Hermoso 应用的 MCP & CLI 中创建密钥。
    url: https://app.hermoso.ai/
tools:
  - tools/hermoso_credits.yaml
  - tools/list_channels.yaml
  - tools/find_competitors.yaml
  - tools/pull_competitor_ads.yaml
  - tools/research_ads.yaml
  - tools/generate_image.yaml
  - tools/generate_video.yaml
  - tools/get_job.yaml
  - tools/list_library.yaml
  - tools/schedule_post.yaml
  - tools/list_scheduled_posts.yaml
  - tools/cancel_scheduled_post.yaml
extra:
  python:
    source: provider/hermoso.py
